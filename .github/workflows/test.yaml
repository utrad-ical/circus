name: Test

# Runs once for each PR (including those from forks, whose pushes do not
# run here) and for each push to master
on:
  push:
    branches: [master]
  pull_request:

jobs:
  prettier-check:
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24.x
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Prettier Check
        run: |
          pnpm run lint-prettier
          if [ $? -ne 0 ]; then
            echo "Prettier check failed."
            exit 1
          fi
      - name: Run ESlint
        run: |
          pnpm run lint
          if [ $? -ne 0 ]; then
            echo "ESlint failed."
            exit 1
          fi

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [24.x, 26.x]
      fail-fast: false

    # services:
    #   mongodb:
    #     image: mongo:4.2.2-bionic
    #     ports:
    #       - 27017:27017

    steps:
      - uses: actions/checkout@v7
      - name: Start mongod
        shell: bash
        run: |
          docker run --name mongo -p 27017:27017 -d \
            -e GLIBC_TUNABLES=glibc.pthread.rseq=1 mongo:9.0 --replSet rs0
          until docker exec mongo mongosh --quiet --eval 'db.hello().ok' >/dev/null 2>&1; do sleep 1; done
          docker exec mongo mongosh --quiet --eval \
            "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] })"
          until [ "$(docker exec mongo mongosh --quiet --eval 'db.hello().isWritablePrimary')" = true ]; do sleep 1; done
      - uses: pnpm/action-setup@v6
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pull dicom_utility from Docker Hub
        run: |
          docker pull hello-world
          docker pull circuscad/dicom_utility:2.0.0-beta3
          docker pull circuscad/dicom_voxel_dump:1.0.0
          cd packages/circus-cs-core/test/docker
          node build.js
      - name: Build packages (tsdown) and web UI (webpack)
        run: pnpm run build
      - name: Run TypeScript Check
        run: |
          pnpm run typecheck
          if [ $? -ne 0 ]; then
            echo "TypeScript check failed."
            exit 1
          fi
      - name: Run test
        run: pnpm test
        env:
          CI: true
          CIRCUS_MONGO_TEST_URL: 'mongodb://localhost:27017/circus-api-test'
      - name: Stop mongod
        if: always()
        run: |
          docker stop mongo
