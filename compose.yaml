# Minimal example compose file to run CIRCUS in production.
# You typically need to copy this file somewhere and edit it to
# suit your needs (HTTPS, backup, logging, etc.).
# Only the web UI is published on the host; MongoDB and the API server
# are reachable only from the other containers.
# For development, add compose.dev.yaml (see README.md).
#
# Initialize/upgrade the database: docker compose run --rm api circus db migrate

name: circus

services:
  mongo:
    image: mongo:9.0
    command: --replSet rs0 --bind_ip_all
    environment:
      # Required on Linux kernel 6.19+ (SERVER-121912); harmless on older kernels
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    volumes:
      - ${CIRCUS_DATA_DIR:-/var/circus/data}/mongodb:/data/db
    healthcheck:
      # Initializes the replica set on the first run, and reports healthy
      # only when this node is the writable primary. An existing replica set
      # config with a different member name is NOT fixed automatically.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - |
          try {
            rs.status();
          } catch (e) {
            if (e.code !== 94) throw e; // 94: NotYetInitialized
            rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] });
          }
          quit(db.hello().isWritablePrimary ? 0 : 1);
      interval: 5s
      start_period: 30s
    restart: unless-stopped

  api:
    image: ghcr.io/utrad-ical/circus-api:${CIRCUS_TAG:?Set CIRCUS_TAG to the version of the images}
    init: true
    volumes:
      - ${CIRCUS_DATA_DIR:-/var/circus/data}:/var/circus/data
      - /var/run/docker.sock:/var/run/docker.sock
      # To use your own configuration file:
      # - ./circus.config.js:/var/circus/circus.config.js:ro
    environment:
      # Host path of the data directory (for plug-in containers via DooD)
      DOOD_HOST_WORKING_PATH: ${CIRCUS_DATA_DIR:-/var/circus/data}
      AUTO_BOOT_JOB_MANAGER: ${AUTO_BOOT_JOB_MANAGER:-0}
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/utrad-ical/circus-web:${CIRCUS_TAG:?Set CIRCUS_TAG to the version of the images}
    ports:
      - ${CIRCUS_HTTP_PORT:-80}:80
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped
