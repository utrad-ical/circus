name: Series
description: >
  Operates DICOM series.
  This handles series information stored in the database.
  Actual image data (voxel values, window, etc.) are not contained.
routes:
  - verb: get
    path: /series
    handler: handleSearch
    description: Retrieves the list of DICOM series.
    responseSchema: series|searchResult
  - verb: get
    path: /series/list/:myListId
    handler: handleSearch
    description: Performs search based on a my list ID.
    responseSchema: series|searchResult
  - verb: post
    path: /series/domain/:domain
    expectedContentType: multipart/form-data
    description: >
      Uploads DICOM files, or zip/tar.gz archives of them, and imports them
      while receiving. Responds with the summary: 201 if all imported,
      422 if some failed, 400 if none was a DICOM file.
      Pass `progressId` to report the progress.
  - verb: post
    path: /series/domain/:domain/single
    expectedContentType: multipart/form-data
    handler: handlePostSingle
    description: Same as `/series/domain/:domain`, with an empty 201 response for compatibility.
  - verb: get
    path: /series/export-cs-volume
    handler: handleGetExportCsVolume
    requiredGlobalPrivilege: downloadVolume
    description: >
      Exports the specified series as the input volumes of CIRCUS CS plug-ins
      in a zip or tar.gz archive.
      Must come before /series/:seriesUid.
      The query is validated by the handler with seriesExportCsVolumeQuery.
  - verb: get
    path: /series/:seriesUid
    description: Returns information about the specified series.
  - verb: get
    path: /series/:seriesUid/orientation
    handler: handleGetOrientation
    responseSchema: seriesOrientation
    description: Returns whether series is head-first or foot-first.
  - verb: delete
    path: /series/:seriesUid
    description: Deletes the specified series.
