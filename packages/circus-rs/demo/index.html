<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CIRCUS RS Demo</title>
    <link rel="stylesheet" href="./demo.css" />
    <style>
      #example-desc {
        margin: 0.8em 0;
        font-weight: bold;
      }

      #example-script {
        min-height: 300px;
      }

      #viewer,
      #viewer2 {
        width: 512px;
        height: 512px;
        background-color: gray;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>CIRCUS RS DEMO</h1>

      <div class="panel inline-form">
        <input type="text" id="seriesUid" placeholder="Series UID" />
        <input
          type="text"
          id="partialVolumeDescriptor"
          placeholder="start:end:delta"
        />
        <input type="text" id="server" placeholder="Server" />
        <select id="type">
          <option>HybridMprImageSource</option>
          <option>DynamicMprImageSource</option>
          <option>RawVolumeMprImageSource</option>
          <option>TwoDimensionalImageSource</option>
          <optgroup label="with WebGL">
            <option>WebGlHybridMprImageSource</option>
            <option>WebGlRawVolumeMprImageSource</option>
            <option>VolumeRenderingImageSource</option>
          </optgroup>
        </select>
        <a href="./solid-figure-annotation.html">Solid figure annotation</a>
        <a href="./ws/index.html">WebSocket</a>
      </div>

      <!-- This is where our toolbar is created -->
      <div id="toolbar"></div>

      <!-- This is where our viewers are initialized -->
      <div class="two-columns">
        <div>
          <div id="viewer"></div>
        </div>
        <div>
          <div id="viewer2"></div>
        </div>
      </div>

      <div id="examples" class="panel">
        <div class="inline-form">
          <select id="example-select"></select>
          <button id="example-run" class="btn btn-primary">▶ Run</button>
        </div>
        <div id="example-desc"></div>
        <textarea id="example-script" spellcheck="false"></textarea>
      </div>
    </div>

    <script type="module" src="./demo.js"></script>
  </body>
</html>
