<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CIRCUS RS Demo</title>

    <link rel="stylesheet" href="./demo.css" />
    <style>
      #viewer1,
      #viewer2,
      #viewer3,
      #viewer4 {
        width: 312px;
        height: 312px;
        background-color: gray;
      }
      #wrap1 {
        padding: 3px;
        background-color: #993300;
      }
      #wrap2 {
        padding: 3px;
        background-color: #3399ff;
      }
      #wrap3 {
        padding: 3px;
        background-color: #33ffee;
      }
      #wrap4 {
        padding: 3px;
        background-color: #ff6600;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Solid Figure Annotation</h1>

      <!-- This is where our toolbar is created -->
      <div id="toolbar"></div>

      <!-- This is where our viewers are initialized -->
      <div style="display: flex">
        <div id="wrap1"><div id="viewer1"></div></div>
        <div id="wrap2"><div id="viewer2"></div></div>
      </div>
      <div style="display: flex">
        <div id="wrap3"><div id="viewer3"></div></div>
        <div id="wrap4"><div id="viewer4"></div></div>
      </div>
    </div>
    <script type="module" src="./solid-figure-annotation.js"></script>
  </body>
</html>
